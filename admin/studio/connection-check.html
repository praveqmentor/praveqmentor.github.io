<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>PRAVEQ 通信確認</title><body><h1>通信処理の確認</h1><button id="run">通信を検証</button><pre id="result">未実行。記事や写真の読み書きは行いません。</pre><script type="module">
import {GitJournal} from './github-store.mjs?v=20261025-9';
const config=await (await fetch('./config.json')).json();
document.querySelector('#run').onclick=async()=>{const output=[];const old={fetcher:fetch};try{await old.fetcher(config.authOrigin+'/health');output.push('旧方式：通信可能');}catch(e){output.push('旧方式：'+e.name+' / '+e.message);}const client=new GitJournal(config,'invalid-browser-verification-token');try{await client.request('/user');output.push('想定外の応答');}catch(e){output.push(e.status===401?'修正方式：PASS。実サーバーからHTTP 401を受信。通信成功、未認証の拒否を確認。':'修正方式：FAIL / '+e.message);}document.querySelector('#result').textContent=output.join('\n');};
</script></body></html>
